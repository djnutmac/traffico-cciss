<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCISS Monitor</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary: #0056b3;
            --accent: #dc3545;
            --new-bg: #ff6d00; 
            --new-text: #ffffff; 
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --primary: #3792ff;
                --accent: #ff6b6b;
                --new-bg: #ff6d00; 
                --new-text: #ffffff; 
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding-bottom: 10px;
            z-index: 100;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            text-align: center;
        }
        .filter-box {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-color);
        }
        .btn-refresh {
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .status {
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .news-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .news-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .news-card.critico {
            border-left-color: var(--accent);
        }
        .news-card.nuova-notizia {
            background-color: var(--new-bg) !important;
            color: var(--new-text) !important;
            border-left-style: dashed;
        }
        .news-card.nuova-notizia .news-title {
            color: var(--new-text) !important;
        }
        .news-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 5px;
            color: var(--primary);
        }
        .news-desc {
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .news-time {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 8px;
            text-align: right;
        }
        .no-results {
            text-align: center;
            padding: 30px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>⚠️ CCISS Traffico Real-Time</h1>
    <div class="filter-box">
        <input type="text" id="searchFilter" placeholder="Cerca es. A1, Milano, PV, coda..." oninput="filterNews()">
        <button class="btn-refresh" onclick="manualRefresh()">🔄</button>
    </div>
    <div id="status" class="status">Inizializzazione in corso...</div>
</div>

<div id="newsContainer" class="news-container"></div>

<script>
    let allEntries = [];
    let previousTitles = new Set();
    let lastSuccessTime = "";
    
    const POLLING_INTERVAL = 90; // Ottimizzato a 90 secondi per sincronizzarsi con Pipedream
    let secondsToNextRefresh = POLLING_INTERVAL;
    let timerInterval = null;

    // --- CONFIGURA QUI I TUOI DATI DI GITHUB PER IL BYPASS TOTALE DELLA CACHE ---
    const USERNAME = "djnutmac";
    const REPOSITORY = "traffico-cciss";
    // ----------------------------------------------------------------------------

    async function fetchFeed() {
        const statusEl = document.getElementById('status');
        
        // PUNTAMENTO DIRETTO AL CONTENUTO RAW DEL REPOSITORY (ZERO CACHE DELLA CDN)
        const jsonUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPOSITORY}/main/feed.json?_ts=${new Date().getTime()}`;

        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error("File JSON non raggiungibile.");
            
            const items = await response.json();
            
            if (allEntries.length > 0) {
                previousTitles = new Set(allEntries.map(e => e.title + e.pubDate));
            } else {
                previousTitles = new Set();
            }

            allEntries = [];

            for (let i = 0; i < items.length; i++) {
                const title = items[i].title || "";
                const description = items[i].description || "";
                const pubDate = items[i].pubDate || "";
                
                const uniqueKey = title + pubDate;
                const isNew = previousTitles.size > 0 && !previousTitles.has(uniqueKey);

                allEntries.push({ title, description, pubDate, isNew });
            }

            lastSuccessTime = new Date().toLocaleTimeString();
            secondsToNextRefresh = POLLING_INTERVAL;
            updateStatusText(`${allEntries.length} notizie caricate.`);
            filterNews();

        } catch (error) {
            console.error(error);
            statusEl.innerText = "Sincronizzazione dati fallita. Riprovo...";
            secondsToNextRefresh = 10; 
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsToNextRefresh--;
            if (secondsToNextRefresh <= 0) {
                fetchFeed();
            } else {
                if (allEntries.length > 0) {
                    updateStatusText(`${allEntries.length} notizie rilevate.`);
                }
            }
        }, 1000);
    }

    function updateStatusText(suffix) {
        const statusEl = document.getElementById('status');
        const minuti = Math.floor(secondsToNextRefresh / 60);
        const secondi = secondsToNextRefresh % 60;
        const tempoString = `${minuti}:${secondi.toString().padStart(2, '0')}`;
        statusEl.innerText = `Ultimo agg: ${lastSuccessTime} | Prossimo controllo tra: ${tempoString} (${suffix})`;
    }

    function manualRefresh() {
        fetchFeed();
    }

    function filterNews() {
        const query = document.getElementById('searchFilter').value.toLowerCase().trim();
        const container = document.getElementById('newsContainer');
        container.innerHTML = "";

        const keywords = query.split(/\s+/).filter(kw => kw.length > 0);

        const filtered = allEntries.filter(entry => {
            const fullText = (entry.title + " " + entry.description).toLowerCase();
            return keywords.every(kw => fullText.includes(kw));
        });

        if (filtered.length === 0) {
            container.innerHTML = '<div class="no-results">Nessun evento corrisponde ai filtri inseriti.</div>';
            return;
        }

        filtered.forEach(entry => {
            const card = document.createElement('div');
            card.className = 'news-card';
            
            if (entry.isNew) {
                card.classList.add('nuova-notizia');
            }

            const isCritico = entry.title.toLowerCase().includes('chiuso') || 
                              entry.title.toLowerCase().includes('bloccato') ||
                              entry.description.toLowerCase().includes('chiuso') || 
                              entry.description.toLowerCase().includes('bloccato');
                              
            if (isCritico) {
                card.classList.add('critico');
            }

            let formattedTime = entry.pubDate;
            try {
                const dateObj = new Date(entry.pubDate);
                if (!isNaN(dateObj)) {
                    formattedTime = dateObj.toLocaleString('it-IT', { 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        day: '2-digit', 
                        month: '2-digit' 
                    });
                }
            } catch(e) {}

            card.innerHTML = `
                <div class="news-title">${escapeHtml(entry.title)}</div>
                <div class="news-desc">${escapeHtml(entry.description)}</div>
                <div class="news-time">${formattedTime}</div>
            `;
            container.appendChild(card);
        });
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    fetchFeed();
    startTimer();
</script>

</body>
</html>
